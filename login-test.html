<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HSIA — Login test</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030202;--c:#171616;--p2:#262525;--l:#454444;--t:#F0F1F3;--m:#8B909B;--a:#D6D8DC;--ok:#23724a;--no:#a8434b;--w:#a9741a}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#212020 0%,var(--bg) 60%) fixed;color:var(--t);font:15px/1.45 Inter,"Noto Sans Bengali",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:18px 16px calc(36px + env(safe-area-inset-bottom,0px))}
.bar{padding:calc(9px + env(safe-area-inset-top,0px)) 14px 9px;font:700 13px 'Space Grotesk',Inter,sans-serif;letter-spacing:.04em;text-align:center;color:#fff;position:sticky;top:0;z-index:5}
.ok{background:var(--ok)}.no{background:var(--no)}.wait{background:var(--w)}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.ttl{font:700 11px 'Space Grotesk',Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--m);margin-bottom:10px}
h3{margin:0 0 6px;font-family:'Space Grotesk',Inter,sans-serif}.mut{color:var(--m);font-size:13px}
label{display:block;font-size:12px;color:var(--m);margin:12px 0 0;letter-spacing:.02em}
input,select,.in{width:100%;padding:11px 12px;margin-top:5px;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t);font:inherit;text-align:left}
input:focus{outline:0;border-color:#A6ABB4}input[readonly]{opacity:.6}
button{font:inherit;cursor:pointer}.b,.g{font-family:'Space Grotesk',Inter,sans-serif}
.b{width:100%;margin-top:12px;padding:12px 16px;border-radius:12px;border:1px solid #d6d8dc;background:linear-gradient(135deg,#A9AEB8,#DADCE0);color:#14151a;font-weight:700;font-size:14px;letter-spacing:.02em}
.b.gh{background:var(--p2);color:var(--m);border:1px solid var(--l)}
.g{padding:8px 13px;margin:6px 6px 0 0;border-radius:10px;border:1px solid var(--l);background:transparent;color:var(--m);font-weight:600;font-size:12.5px}
.two{display:flex;gap:10px}.lnk{display:block;text-align:center;color:var(--m);margin:18px;text-decoration:underline;cursor:pointer;font-size:13px}
.pic{display:flex;gap:12px;align-items:center;margin-top:14px}
.pv{width:86px;height:110px;border-radius:10px;border:1px dashed var(--l);background:var(--bg) center/cover no-repeat;flex:none}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--l);cursor:pointer}
.row:first-child{border:0}.row img{width:40px;height:52px;object-fit:cover;border-radius:6px;background:var(--bg)}
.tabs{display:flex;gap:8px}.tabs .g{flex:1;margin:0;border-radius:999px}.tabs .on{background:rgba(139,144,155,.32);border-color:var(--t);color:var(--t)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.ov>div{background:var(--c);border:1px solid var(--l);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
canvas{touch-action:none;border-radius:8px;border:1px solid var(--l);display:block;margin:8px auto}
.kb{font-weight:700;color:var(--a)}
.bar.tb{padding:calc(4px + env(safe-area-inset-top,0px)) 10px 4px;font-size:11px;background:var(--no)}
.pk{flex:1;padding:13px 0;border-radius:10px;border:1px solid var(--l);background:var(--p2);color:var(--m);font:700 15px 'Space Grotesk',Inter,sans-serif}
.pk:active{background:linear-gradient(135deg,#A6ABB4,#D6D8DC);color:#1B2130}
.fd{border:1px solid var(--l);border-radius:12px;padding:4px 10px;margin:8px 0;background:var(--p2)}
.fr,.ps{display:flex;align-items:center;gap:8px;padding:7px 0}.ps{border-top:1px solid var(--l)}.pl{margin-left:14px}
.fn{flex:1;min-width:0;word-break:break-word}
.gp{padding:6px 8px;color:var(--m);font-size:18px;touch-action:none;user-select:none;cursor:grab}
.ic{width:34px;height:34px;border-radius:9px;border:1px solid var(--l);background:transparent;color:var(--m);font-size:15px}
.dg{opacity:.7;background:var(--c);position:relative;z-index:3}.ins{box-shadow:0 -2px 0 var(--a)}.insb{box-shadow:0 2px 0 var(--a)}
.fh{font:700 11px 'Space Grotesk',Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--m);margin:12px 0 2px}
</style></head><body>
<div id="bar"></div><main id="app"></main>
<script>
/* ===== data layer: localStorage stand-in for Firebase. Same shape as planned for Firebase:
   profiles/<uid> (text + status), profilePics/<uid> (photos + thumb), designations (ordered) ===== */
const K='HSIA_T_DB',P='HSIA_T_PICS',PIN='1234';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,x)=>{try{localStorage.setItem(k,JSON.stringify(x));return 1}catch(e){alert('টেস্ট মেমরি ভরে গেছে (~৫MB)। আসল ডেটাবেজে এই সীমা নেই।');return 0}};
let db=ld(K,{fold:null,prof:{},acc:{}}),pics=ld(P,{});
if(!db.fold){db.fold=[{id:'f1',n:'Controller',posts:[{id:'p1',n:'SATO'},{id:'p2',n:'DD'},{id:'p3',n:'AD'},{id:'p4',n:'AO'}]},{id:'f2',n:'Aerodrome Assistant',posts:[{id:'p5',n:'Aerodrome Assistant'}]},{id:'f3',n:'Operator',posts:[{id:'p6',n:'Aerodrome Operator'},{id:'p7',n:'Radio Operator'}]},{id:'f4',n:'Traffic Hand & Marshaller',posts:[{id:'p8',n:'Traffic Hand'},{id:'p9',n:'Marshaller'}]}];
 const old=(db.des||[]).filter(d=>Object.values(db.prof).some(p=>p.des===d.id));if(old.length)db.fold.push({id:'f0',n:'Old posts (test)',posts:old});delete db.des;sv(K,db)}
db.acc=db.acc||{};
const uid=e=>String(e).trim().toLowerCase().replace(/\./g,',').replace(/[#$\[\]\/\s]/g,'_');
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dn=s=>String(s||'').replace(/[০-৯]/g,c=>'০১২৩৪৫৬৭৮৯'.indexOf(c));
const dName=id=>{for(const g of db.fold)for(const p of g.posts)if(p.id===id)return p.n;return''},man=u=>String(u).startsWith('ein:');
const TR=864e5,TM=['A','B','C','D','E'],OT=['OJTI','Standby','Regular (৯–৫, শুক্র-শনি বন্ধ)','সপ্তাহে ৬ দিন ডিউটি','অন্যান্য'];
let ts=+localStorage.getItem('T_TRIAL')||0;
const left=()=>TR-(Date.now()-ts),hms=x=>{x=Math.max(0,x)/1000|0;return[x/3600|0,x/60%60|0,x%60].map(n=>String(n).padStart(2,'0')).join(':')};
const tl=p=>!p.team?'—':p.team==='O'?'Others'+(p.oth?' · '+p.oth:''):'Team '+p.team;
let me=localStorage.getItem('T_ME')||'',v='home',tab='p',f={},np={};

/* ===== photos: centre-crop to the exact size, then the best WebP/JPEG quality that stays under the size cap ===== */
const SPEC={p:{w:413,h:531,kb:40,n:'Passport ছবি'},a:{w:650,h:1005,kb:110,n:'AVSEC ID ছবি'}};   /* 35×45 mm and 55×85 mm at ~300 dpi */
const MIME=document.createElement('canvas').toDataURL('image/webp').indexOf('image/webp')>0?'image/webp':'image/jpeg';
const kbOf=d=>Math.round((d.length-d.indexOf(',')-1)*.75/1024*10)/10;
function enc(c,max){let lo=.3,hi=.92,best=c.toDataURL(MIME,lo);for(let i=0;i<8;i++){const q=(lo+hi)/2,d=c.toDataURL(MIME,q);if(kbOf(d)<=max){best=d;lo=q}else hi=q}return best}
function pick(k,cam){const i=document.createElement('input');i.type='file';i.accept='image/*';if(cam)i.capture=k==='p'?'user':'environment';
 i.onchange=()=>{const fl=i.files[0];if(!fl)return;const im=new Image();im.onload=()=>cropper(k,im);im.onerror=()=>alert('ছবি খোলা যায়নি');im.src=URL.createObjectURL(fl)};i.click()}
/* ===== 4-corner perspective crop: the corners are auto-detected, can be dragged, then the quad is warped flat to the exact size ===== */
const MAXS=1600;
function srcCanvas(im){const s=Math.min(1,MAXS/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);return c}
function rot90(c){const r=document.createElement('canvas');r.width=c.height;r.height=c.width;const g=r.getContext('2d');g.translate(c.height,0);g.rotate(Math.PI/2);g.drawImage(c,0,0);return r}
function defQuad(c,S){const a=S.w/S.h;let bw,bh;if(c.width/c.height>a){bh=c.height*.8;bw=bh*a}else{bw=c.width*.8;bh=bw/a}const x=(c.width-bw)/2,y=(c.height-bh)/2;return[[x,y],[x+bw,y],[x+bw,y+bh],[x,y+bh]]}
function detect(c){const s=160/Math.max(c.width,c.height),w=Math.max(8,Math.round(c.width*s)),h=Math.max(8,Math.round(c.height*s)),t=document.createElement('canvas');t.width=w;t.height=h;const g=t.getContext('2d');g.drawImage(c,0,0,w,h);
 const d=g.getImageData(0,0,w,h).data,n=w*h,gr=new Uint8Array(n),H=new Array(256).fill(0);
 for(let i=0;i<n;i++){gr[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;H[gr[i]]++}
 let sum=0;for(let i=0;i<256;i++)sum+=i*H[i];let wB=0,sB=0,mx=-1,th=128;
 for(let i=0;i<256;i++){wB+=H[i];const wF=n-wB;if(!wB||!wF)continue;sB+=i*H[i];const a=sB/wB,b=(sum-sB)/wF,v=wB*wF*(a-b)*(a-b);if(v>mx){mx=v;th=i}}
 let best=null,bs=0;   /* biggest blob (light-on-dark or dark-on-light) that does not touch the picture edge = the page / card */
 for(const pol of[0,1]){const m=new Uint8Array(n),seen=new Uint8Array(n);for(let i=0;i<n;i++)m[i]=((gr[i]>th)?1:0)===pol?1:0;
  for(let i=0;i<n;i++){if(!m[i]||seen[i])continue;const st=[i];seen[i]=1;let a=0,bd=0,t1=1e9,t2=-1e9,t3=-1e9,t4=1e9;const P=[0,0,0,0];
   while(st.length){const j=st.pop(),x=j%w,y=(j/w)|0;a++;if(!x||!y||x===w-1||y===h-1)bd=1;const s1=x+y,s2=x-y;
    if(s1<t1){t1=s1;P[0]=[x,y]}if(s2>t3){t3=s2;P[1]=[x,y]}if(s1>t2){t2=s1;P[2]=[x,y]}if(s2<t4){t4=s2;P[3]=[x,y]}
    for(const k of[x>0?j-1:-1,x<w-1?j+1:-1,y>0?j-w:-1,y<h-1?j+w:-1])if(k>=0&&m[k]&&!seen[k]){seen[k]=1;st.push(k)}}
   if(!bd&&a>n*.1&&a<n*.92&&a>bs){const ar=Math.abs(P.reduce((z,p,i)=>z+p[0]*P[(i+1)%4][1]-P[(i+1)%4][0]*p[1],0))/2;if(ar>n*.12){bs=a;best=P}}}}
 return best&&best.map(p=>[(p[0]+.5)*c.width/w,(p[1]+.5)*c.height/h])}
function homog(q,W,H){const D=[[0,0],[W,0],[W,H],[0,H]],A=[];   /* destination rectangle -> source quad */
 for(let i=0;i<4;i++){const[x,y]=D[i],[u,v]=q[i];A.push([x,y,1,0,0,0,-x*u,-y*u,u]);A.push([0,0,0,x,y,1,-x*v,-y*v,v])}
 for(let c=0;c<8;c++){let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];
  for(let r=0;r<8;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<9;k++)A[r][k]-=f*A[c][k]}}
 return A.map((r,i)=>r[8]/r[i])}
function warp(c,q,W,H){const s=c.getContext('2d').getImageData(0,0,c.width,c.height).data,sw=c.width,sh=c.height,m=homog(q,W,H),o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d'),im=g.createImageData(W,H),od=im.data;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const z=m[6]*x+m[7]*y+1,u=(m[0]*x+m[1]*y+m[2])/z,v=(m[3]*x+m[4]*y+m[5])/z,i=(y*W+x)*4;
  if(!(u>=0&&v>=0&&u<=sw-1&&v<=sh-1)){od[i]=od[i+1]=od[i+2]=od[i+3]=255;continue}
  const x0=u|0,y0=v|0,x1=Math.min(x0+1,sw-1),y1=Math.min(y0+1,sh-1),fx=u-x0,fy=v-y0;
  for(let k=0;k<3;k++)od[i+k]=s[(y0*sw+x0)*4+k]*(1-fx)*(1-fy)+s[(y0*sw+x1)*4+k]*fx*(1-fy)+s[(y1*sw+x0)*4+k]*(1-fx)*fy+s[(y1*sw+x1)*4+k]*fx*fy;od[i+3]=255}
 g.putImageData(im,0,0);return o}
function cropper(k,im){const S=SPEC[k];let cur=srcCanvas(im),q,sk,cw,ch,dg=-1;
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div><b>${S.n} — কোণের ডট টেনে ঠিক করুন</b><p class="mut">চারটি ডট ছবির চার কোণে বসান, ছবি সোজা হয়ে যাবে। (ডট নিজে থেকেই কোণ খুঁজে নেয়)</p><canvas></canvas><button class="g" id="rt">↻ ঘোরান</button><button class="g" id="au">⟲ অটো কোণ</button><button class="b" id="ok">✔ ঠিক আছে</button><button class="b" id="cx" style="background:var(--c);color:var(--t);border:1px solid var(--l)">বাতিল</button></div>`;
 document.body.appendChild(o);const cv=o.querySelector('canvas'),x=cv.getContext('2d');
 const paint=()=>{x.clearRect(0,0,cw,ch);x.drawImage(cur,0,0,cw,ch);x.lineWidth=2;x.strokeStyle='#4da3ff';x.beginPath();q.forEach((p,i)=>x[i?'lineTo':'moveTo'](p[0]*sk,p[1]*sk));x.closePath();x.stroke();
  q.forEach(p=>{x.beginPath();x.arc(p[0]*sk,p[1]*sk,11,0,7);x.fillStyle='rgba(255,255,255,.92)';x.fill();x.lineWidth=3;x.strokeStyle='#1a5fd0';x.stroke()})};
 const setup=a=>{const f=Math.min(Math.min(innerWidth-32,360)/cur.width,innerHeight*.5/cur.height);sk=f;cw=Math.round(cur.width*f);ch=Math.round(cur.height*f);cv.width=cw;cv.height=ch;if(a||!q)q=detect(cur)||defQuad(cur,S);paint()};
 setup(1);
 cv.onpointerdown=e=>{const r=cv.getBoundingClientRect(),X=e.clientX-r.left,Y=e.clientY-r.top;let b=40;dg=-1;q.forEach((p,i)=>{const d=Math.hypot(p[0]*sk-X,p[1]*sk-Y);if(d<b){b=d;dg=i}});if(dg>=0)cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(dg<0)return;const r=cv.getBoundingClientRect();q[dg]=[Math.max(0,Math.min(cur.width,(e.clientX-r.left)/sk)),Math.max(0,Math.min(cur.height,(e.clientY-r.top)/sk))];paint()};cv.onpointerup=()=>dg=-1;
 o.querySelector('#rt').onclick=()=>{cur=rot90(cur);setup(1)};o.querySelector('#au').onclick=()=>setup(1);o.querySelector('#cx').onclick=()=>o.remove();
 o.querySelector('#ok').onclick=()=>{const w=warp(cur,q,S.w,S.h),d=enc(w,S.kb);np[k]=d;
  if(k==='p'){const t=document.createElement('canvas');t.width=96;t.height=Math.round(96*S.h/S.w);t.getContext('2d').drawImage(w,0,0,t.width,t.height);np.t=enc(t,5)}
  o.remove();showPic(k)}}
function showPic(k){const d=np[k]||(pics[f._u]||{})[k];$('#pv'+k).style.backgroundImage=d?`url(${d})`:'';$('#pk'+k).innerHTML=d?`<span class="kb">${kbOf(d)} KB</span> · ${SPEC[k].w}×${SPEC[k].h}px · ${MIME.slice(6)}`:'ছবি নেই'}

/* ===== registration form (also used by the admin review) ===== */
const fld=(id,l,val,x)=>`<label>${l}<input id="${id}" value="${esc(val)}" ${x||''}></label>`;
const picH=(k,u)=>`<div class="pic"><div class="pv" id="pv${k}"></div><div><b>${SPEC[k].n} *</b><div class="mut" id="pk${k}"></div><button type="button" class="g" data-k="${k}">গ্যালারি</button><button type="button" class="g" data-k="${k}" data-c="1">ক্যামেরা</button></div></div>`;
function fields(u){return fld('bn','নাম (বাংলায়) *',f.bn)+fld('en','Name (English) *',f.en)+`<label>Designation *<button type="button" class="in" id="ds">${esc(dName(f.des))||'পদবী বাছুন ▾'}</button></label>`+fld('ein','EIN number *',f.ein,man(u)?'readonly':'inputmode="numeric"')+fld('mail','Gmail'+(man(u)?' (ঐচ্ছিক)':''),f.mail,man(u)?'inputmode="email"':'readonly')+fld('ph','Phone number *',f.ph,'inputmode="tel"')+picH('p',u)+picH('a',u)}
function bind(){['bn','en','ein','ph','mail'].forEach(i=>$('#'+i).oninput=e=>f[i]=e.target.value);
 $('#ds').onclick=()=>{const o=document.createElement('div');o.className='ov';o.innerHTML='<div><div class="ttl">পদবী বাছুন</div>'+db.fold.map(g=>`<div class="fh">${esc(g.n)}</div>`+g.posts.map(d=>`<div class="row" data-i="${d.id}">${esc(d.n)}</div>`).join('')).join('')+'</div>';document.body.appendChild(o);
  o.onclick=e=>{const r=e.target.closest('[data-i]');if(r){f.des=r.dataset.i;$('#ds').textContent=dName(f.des)}if(r||e.target===o)o.remove()}};
 document.querySelectorAll('.pic button').forEach(b=>b.onclick=()=>pick(b.dataset.k,b.dataset.c));showPic('p');showPic('a')}
function check(){const e=[];if(!/[\u0980-\u09FF]/.test(f.bn||''))e.push('বাংলা নাম');if(!/[A-Za-z]{2}/.test(f.en||''))e.push('English name');if(!f.des)e.push('Designation');
 f.ein=dn(f.ein).trim();if(!/^\d{3,12}$/.test(f.ein))e.push('EIN (শুধু সংখ্যা)');else if(Object.keys(db.prof).some(x=>x!==f._u&&db.prof[x].ein===f.ein))e.push('এই EIN আগে নিবন্ধিত');if(f.mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.mail))e.push('Gmail');f.ph=dn(f.ph).replace(/[\s-]/g,'');if(!/^(\+?88)?01\d{9}$/.test(f.ph))e.push('Phone (01XXXXXXXXX)');
 const o=pics[f._u]||{};if(!(np.p||o.p))e.push('Passport ছবি');if(!(np.a||o.a))e.push('AVSEC ছবি');if(e.length)alert('ঠিক করুন: '+e.join(', '));return!e.length}
function commit(st,note){const u=f._u,p={...f};delete p._u;p.st=st;p.note=note||'';p.at=Date.now();db.prof[u]=p;pics[u]={...(pics[u]||{}),...np};np={};return sv(K,db)&&sv(P,pics)}

/* ===== screens ===== */
function render(){const p=db.prof[uid(me)],tr=!me&&ts&&left()>0;
 $('#bar').innerHTML=tr?`<div class="bar tb" id="tb">⏱ ট্রায়াল — ${hms(left())} বাকি</div>`:!p||v==='admin'?'':p.st==='approved'?`<div class="bar ok">✅ Welcome ${esc(p.en)}</div>`:p.st==='rejected'?`<div class="bar no">❌ REJECTED — ${esc(p.note)}</div>`:'<div class="bar wait">⏳ ID PENDING — অ্যাডমিন অনুমোদনের অপেক্ষায়</div>';
 const m=$('#app');if(v==='admin')return admin(m);if(!me){if(tr)return v==='login'?login(m):trial(m);if(ts)return login(m,1);return v==='login'?login(m):gate(m)}if(v==='form'||!p){f=p?{...p,_u:uid(me)}:man(me)?{ein:me.slice(4),mail:'',_u:uid(me)}:{mail:me,_u:uid(me)};np={};m.innerHTML=`<div class="card"><h2>নিবন্ধন</h2><p class="mut">* চিহ্নিত ঘর আবশ্যক। সেভ করলে অ্যাডমিন যাচাই করবেন।</p>${fields(f._u)}<button class="b" id="sv">সেভ করুন</button></div>`;bind();return $('#sv').onclick=()=>{if(check()&&commit('pending'))teamPick(uid(me),()=>{v='home';render()})}}
 home(m,p)}
function popup(t,msg,cb){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div><div class="ttl">${t}</div><p style="margin:0">${msg}</p><button class="b" id="pok">শুরু করুন</button><button class="b gh" id="pcx">বাতিল</button></div>`;document.body.appendChild(o);o.querySelector('#pcx').onclick=()=>o.remove();o.querySelector('#pok').onclick=()=>{o.remove();cb()}}
function gate(m){m.innerHTML=`<div class="card"><div class="ttl">HSIA ATM</div><button class="b" id="g1" style="margin-top:0">🔐 Login</button><button class="b gh" id="g2">Continue without login</button><p class="mut" style="margin:12px 0 0">লগইন ছাড়া ২৪ ঘণ্টার ট্রায়াল পাবেন; এরপর লগইন লাগবে।</p></div>`;
 $('#g1').onclick=()=>{v='login';render()};$('#g2').onclick=()=>popup('ট্রায়াল — ২৪ ঘণ্টা','আপনি এখন ২৪ ঘণ্টা লগইন ছাড়া অ্যাপ দেখতে পারবেন। উপরের লাল বারে বাকি সময় দেখাবে। সময় শেষ হলে এই ডিভাইসে লগইন ছাড়া আর ঢোকা যাবে না।',()=>{ts=Date.now();localStorage.setItem('T_TRIAL',ts);render()})}
function trial(m){m.innerHTML=`<div class="card"><h3>অ্যাপ প্রিভিউ — ট্রায়াল</h3><p class="mut">লগআউট অবস্থায় যতটুকু দেখা যায় ততটুকু (শুধু আজকের রোস্টার)।</p></div><button class="b" id="t1">Login / নিবন্ধন</button>`;$('#t1').onclick=()=>{v='login';render()}}
function teamPick(u,cb){const o=document.createElement('div');o.className='ov';document.body.appendChild(o);
 const fin=(t,x)=>{const p=db.prof[u];p.team=t;p.oth=x||'';sv(K,db);o.remove();cb()};
 const s1=()=>{o.innerHTML=`<div><div class="ttl" style="text-align:center">Which team are you on?</div><div class="two" style="gap:8px">${TM.map(t=>`<button class="pk" data-t="${t}">${t}</button>`).join('')}</div><button class="pk" data-t="O" style="width:100%;margin-top:10px">Others</button><p class="mut" style="text-align:center;margin:10px 0 0">Others = OJTI, Standby, Regular ৯–৫ ইত্যাদি (রোস্টার ডিউটির বাইরে)</p></div>`;
  o.onclick=e=>{const b=e.target.closest('[data-t]');if(b)b.dataset.t==='O'?s2():fin(b.dataset.t)}};
 const s2=()=>{o.innerHTML=`<div><div class="ttl" style="text-align:center">Others — আপনার ধরন</div>${OT.map((t,i)=>`<button class="pk" data-x="${i}" style="width:100%;margin-top:8px">${esc(t)}</button>`).join('')}<a class="lnk" id="tb2">← ফিরে যান</a></div>`;
  o.onclick=e=>{const b=e.target.closest('[data-x]');if(b)fin('O',OT[+b.dataset.x]);else if(e.target.id==='tb2')s1()}};
 s1()}
async function hash(pw,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function login(m,ex){m.innerHTML=(ex?'<div class="card"><b>⏱ ট্রায়ালের ২৪ ঘণ্টা শেষ।</b><p class="mut" style="margin:6px 0 0">চালিয়ে যেতে লগইন করুন।</p></div>':'')+`<div class="card"><div class="ttl">HSIA ATM</div><button class="b" id="gl" style="margin-top:0">🔵 Continue with Google</button><p class="mut" style="text-align:center;margin:16px 0 0">অথবা EIN ও নিজের পছন্দের পাসওয়ার্ড দিয়ে</p><label>EIN number<input id="le" inputmode="numeric"></label><label>পাসওয়ার্ড (কমপক্ষে ৫ অক্ষর)<input id="lp" type="password"></label><div class="two"><button class="b" id="li">লগইন</button><button class="b gh" id="lc">নতুন একাউন্ট</button></div><p class="mut" style="margin:12px 0 0">টেস্টে Gmail হাতে লিখতে হয়; আসল অ্যাপে Google-এর পপআপ আসবে।</p></div><a class="lnk" id="al">অ্যাডমিন (টেস্ট PIN ১২৩৪)</a>`+(ex?'':'<a class="lnk" id="bk2">← ফিরে যান</a>');if($('#bk2'))$('#bk2').onclick=()=>{v='home';render()};
 $('#gl').onclick=()=>{const e=(prompt('আপনার Gmail লিখুন')||'').trim().toLowerCase();if(!e)return;if(!/^[^@\s]+@gmail\.com$/.test(e))return alert('সঠিক Gmail দিন');me=e;localStorage.setItem('T_ME',e);render()};
 const go=async mk=>{const e=dn($('#le').value).trim(),pw=$('#lp').value,a=db.acc[e];if(!/^\d{3,12}$/.test(e))return alert('সঠিক EIN দিন (শুধু সংখ্যা)');if(pw.length<5)return alert('পাসওয়ার্ড কমপক্ষে ৫ অক্ষর');
  if(mk){if(a)return alert('এই EIN-এর একাউন্ট আছে, লগইন করুন');const sl=Math.random().toString(36).slice(2);db.acc[e]={s:sl,h:await hash(pw,sl)};if(!sv(K,db))return}
  else if(!a||a.h!==await hash(pw,a.s))return alert('EIN বা পাসওয়ার্ড ঠিক নয়');
  me='ein:'+e;localStorage.setItem('T_ME',me);render()};
 $('#li').onclick=()=>go(0);$('#lc').onclick=()=>go(1);$('#al').onclick=()=>{if(prompt('অ্যাডমিন PIN')===PIN){v='admin';render()}}}
function home(m,p){const u=uid(me),ap=p.st==='approved',pc=pics[u]||{};if(!p.team&&p.st!=='rejected')teamPick(u,render);
 m.innerHTML=`<div class="card"><h3>অ্যাপ প্রিভিউ</h3><p class="mut">${ap?'পূর্ণ অ্যাপ অ্যাক্সেস চালু।':'অনুমোদনের আগে: লগআউট অবস্থায় যতটুকু দেখা যায় ততটুকু (শুধু আজকের রোস্টার)।'}</p></div>
 ${ap?`<div class="card"><h3>Me (অটো সিঙ্ক)</h3><div class="row"><img src="${pc.t||''}"><div><b>${esc(p.bn)}</b> · ${esc(p.en)}<br><span class="mut">${esc(dName(p.des))} · ${tl(p)} · EIN ${esc(p.ein)}</span></div></div></div>`:''}
 ${p.st!=='approved'?'<button class="b" id="ed">তথ্য সম্পাদনা</button>':''}<a class="lnk" id="lo">লগআউট</a><a class="lnk" id="al">অ্যাডমিন (টেস্ট)</a>`;
 if($('#ed'))$('#ed').onclick=()=>{v='form';render()};$('#lo').onclick=()=>{localStorage.removeItem('T_ME');me='';v='home';render()};$('#al').onclick=()=>{if(prompt('অ্যাডমিন PIN')===PIN){v='admin';render()}}}
function usage(){const n=Object.keys(pics).length,b=JSON.stringify(pics).length/1024;return`<div class="card mut">ছবিসহ ${n} জন: ${b.toFixed(0)} KB${n?` · জন প্রতি গড় ${(b/n).toFixed(0)} KB · ৪০০ জনে ≈ ${(b/n*400/1024).toFixed(0)} MB`:''}</div>`}
function ask(t,val,cb){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div><div class="ttl">${t}</div><input id="at" value="${esc(val)}"><button class="b" id="aok">সেভ</button><button class="b gh" id="acx">বাতিল</button></div>`;document.body.appendChild(o);const i=o.querySelector('#at');i.focus();o.querySelector('#acx').onclick=()=>o.remove();o.querySelector('#aok').onclick=()=>{const x=i.value.trim();if(x){o.remove();cb(x)}}}
function sortable(box,sel,hs,done){box.addEventListener('pointerdown',e=>{const h=e.target.closest(hs),it=h&&h.closest(sel);if(!it||it.parentNode!==box)return;e.preventDefault();
 const y0=e.clientY,sb=[...box.children].filter(c=>c!==it),mids=sb.map(c=>{const r=c.getBoundingClientRect();return r.top+r.height/2});let k=0;it.classList.add('dg');
 const mv=ev=>{it.style.transform=`translateY(${ev.clientY-y0}px)`;k=mids.filter(x=>x<ev.clientY).length;sb.forEach((c,i)=>c.classList.toggle('ins',i===k));box.classList.toggle('insb',k===sb.length)};
 const up=()=>{['pointermove','pointerup','pointercancel'].forEach((n,i)=>document.removeEventListener(n,i?up:mv));sb.forEach(c=>c.classList.remove('ins'));box.classList.remove('insb');it.classList.remove('dg');it.style.transform='';const ids=sb.map(c=>c.dataset.id);ids.splice(k,0,it.dataset.id);done(ids)};
 document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up)})}
const inUse=id=>Object.values(db.prof).some(p=>p.des===id);
function admin(m){const L=st=>Object.keys(db.prof).filter(u=>db.prof[u].st===st);
 const row=u=>{const p=db.prof[u];return`<div class="row" data-u="${u}"><img src="${(pics[u]||{}).t||''}"><div><b>${esc(p.en)}</b> <span class="mut">${esc(p.bn)}</span><br><span class="mut">${esc(dName(p.des))} · ${tl(p)} · EIN ${esc(p.ein)}</span></div></div>`};
 let h=`<div class="tabs"><button class="g ${tab==='p'?'on':''}" data-t="p">পেন্ডিং (${L('pending').length})</button><button class="g ${tab==='a'?'on':''}" data-t="a">অনুমোদিত</button><button class="g ${tab==='d'?'on':''}" data-t="d">পদ</button></div>`;
 if(tab==='p')h+=`<div class="card">${L('pending').concat(L('rejected')).map(row).join('')||'<span class="mut">কোনো পেন্ডিং নেই</span>'}</div>`;
 if(tab==='a')h+=db.fold.map(g=>{const l=L('approved').filter(u=>g.posts.some(p=>p.id===db.prof[u].des));return l.length?`<div class="card"><div class="ttl">${esc(g.n)} (${l.length})</div>`+g.posts.map(p=>{const x=l.filter(u=>db.prof[u].des===p.id);return x.length?`<div class="fh">${esc(p.n)}</div>`+x.map(row).join(''):''}).join('')+'</div>':''}).join('')||'<div class="card mut">কেউ অনুমোদিত নয়</div>';
 if(tab==='d')h+=`<div class="card"><div class="ttl">ফোল্ডার ও পদ</div><p class="mut" style="margin:0 0 6px">⠿ ধরে টেনে ক্রম বদলান · ✎ নাম বদলান · ＋ ভেতরে পদ যোগ</p><div id="fl">${db.fold.map(g=>`<div class="fd" data-id="${g.id}"><div class="fr"><span class="gp fg">⠿</span><b class="fn">${esc(g.n)}</b><button class="ic" data-e="${g.id}">✎</button><button class="ic" data-a="${g.id}">＋</button><button class="ic" data-x="${g.id}">✕</button></div><div class="pl">${g.posts.map(p=>`<div class="ps" data-id="${p.id}"><span class="gp pg">⠿</span><span class="fn">${esc(p.n)}</span><button class="ic" data-e="${p.id}">✎</button><button class="ic" data-x="${p.id}">✕</button></div>`).join('')}</div></div>`).join('')}</div><button class="b" data-a="">＋ নতুন ফোল্ডার</button></div>`;
 m.innerHTML=h+usage()+'<a class="lnk" id="bk">← ফিরে যান</a>';
 if(tab==='d'){const sv2=()=>{sv(K,db);render()};sortable($('#fl'),'.fd','.fg',ids=>{db.fold=ids.map(i=>db.fold.find(g=>g.id===i));sv2()});
  document.querySelectorAll('.pl').forEach(pl=>sortable(pl,'.ps','.pg',ids=>{const g=db.fold.find(x=>x.id===pl.parentNode.dataset.id);g.posts=ids.map(i=>g.posts.find(x=>x.id===i));sv2()}))}
 m.onclick=e=>{const t=e.target.closest('[data-t]'),r=e.target.closest('[data-u]'),ed=e.target.closest('[data-e]'),ad=e.target.closest('[data-a]'),x=e.target.closest('[data-x]'),fin=id=>db.fold.find(g=>g.id===id);
  if(t){tab=t.dataset.t;render()}else if(r)review(r.dataset.u);
  else if(ed){const id=ed.dataset.e,g=fin(id),p=g||db.fold.flatMap(z=>z.posts).find(z=>z.id===id);ask('নাম বদলান',p.n,n=>{p.n=n;sv(K,db);render()})}
  else if(ad){const gid=ad.dataset.a;ask(gid?'নতুন পদের নাম':'নতুন ফোল্ডারের নাম','',n=>{if(gid)fin(gid).posts.push({id:'p'+Date.now(),n});else db.fold.push({id:'f'+Date.now(),n,posts:[]});sv(K,db);render()})}
  else if(x){const id=x.dataset.x,g=fin(id);if(g?g.posts.some(z=>inUse(z.id)):inUse(id))return alert('এতে ব্যবহারকারী আছে, মোছা যাবে না');if(!confirm('মুছবেন?'))return;
   if(g)db.fold=db.fold.filter(z=>z!==g);else db.fold.forEach(z=>z.posts=z.posts.filter(q=>q.id!==id));sv(K,db);render()}
  else if(e.target.id==='bk'){v='home';m.onclick=null;render()}}}

 o.innerHTML=`<div><h3>যাচাই ও অনুমোদন</h3>${fields(u)}<label>Team<select id="tm">${['','A','B','C','D','E','O'].map(t=>`<option value="${t}"${(f.team||'')===t?' selected':''}>${t===''?'— বাছুন —':t==='O'?'Others'+(f.oth?' · '+esc(f.oth):''):'Team '+t}</option>`).join('')}</select></label><label>অ্যাডমিন নোট (বাতিল হলে ইউজার দেখবে)<input id="nt" value="${esc(f.note)}"></label><button class="b" id="ap">✔ Approve</button><button class="b" id="rj" style="background:var(--no);color:#fff">✕ Reject</button><button class="b" id="cl" style="background:var(--c);color:var(--t);border:1px solid var(--l)">বন্ধ করুন</button></div>`;
 document.body.appendChild(o);bind();$('#tm').onchange=e=>f.team=e.target.value;
 $('#cl').onclick=()=>o.remove();$('#ap').onclick=()=>{if(check()&&commit('approved')){o.remove();render()}};

setInterval(()=>{if(me||!ts)return;if(left()<=0){if($('#tb'))render();return}const e=$('#tb');if(e)e.textContent='⏱ ট্রায়াল — '+hms(left())+' বাকি'},1000);
